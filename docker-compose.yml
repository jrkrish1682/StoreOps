version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: storeops-postgres
    environment:
      POSTGRES_USER: storeops
      POSTGRES_PASSWORD: storeops
      POSTGRES_DB: storeops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeops"]
      interval: 10s
      timeout: 5s
      retries: 5

  # StoreOps API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storeops-api
    environment:
      DATABASE_URL: postgresql://storeops:storeops@postgres:5432/storeops
      APP_NAME: StoreOps API
      DEBUG: "false"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    driver: local
